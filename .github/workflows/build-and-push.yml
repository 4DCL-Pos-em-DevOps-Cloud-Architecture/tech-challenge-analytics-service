name: 🚀 Analytics Service - CI e ECR

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: togglemaster-analytics-service
  IMAGE_NAME: analytics-service

permissions:
  contents: read

jobs:
  validate:
    name: 🧪 Validar e analisar
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Baixar código
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 🐳 Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 📦 Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 bandit pytest

      - name: 🎨 Verificar sintaxe e estilo
        run: |
          python -m compileall .
          flake8 .

      - name: 🛡️ Analisar código
        run: bandit -r app.py

      - name: 🧪 Executar testes
        shell: bash
        run: |
          set +e
          pytest
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 5 ]; then
            exit "$status"
          fi

      - name: 🔍 Analisar dependências
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: false

      - name: 🐳 Criar imagem Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🔐 Analisar imagem Docker
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: false

  publish:
    name: 📦 Publicar no ECR
    needs: validate
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Baixar código
        uses: actions/checkout@v4

      - name: 🐳 Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: ☁️ Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔑 Entrar no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 🚀 Criar e publicar imagem
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-gitops:
    name: 🔄 Atualizar GitOps
    needs: publish
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório GitOps
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.GITOPS_REPOSITORY }}
          token: ${{ secrets.GITOPS_TOKEN }}
          ref: main
          path: gitops-repo

      - name: Atualizar tag da imagem
        working-directory: gitops-repo
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          import re

          path = Path("gitops/analytics-service/deployment.yaml")
          content = path.read_text()
          updated, count = re.subn(
              r"(image:\s+[^\s:]+/togglemaster-analytics-service:)[^\s]+",
              r"\g<1>" + os.environ["IMAGE_TAG"],
              content,
          )
          if count != 1:
              raise SystemExit(f"Esperada 1 imagem em {path}, encontradas {count}")
          path.write_text(updated)
          PY

      - name: Commitar e publicar alteração GitOps
        working-directory: gitops-repo
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gitops/analytics-service/deployment.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore: update analytics-service image to ${IMAGE_TAG}"
          git push origin HEAD:main
